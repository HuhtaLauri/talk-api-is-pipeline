[project]
name = "api-is-pipeline"
version = "0.1.0"
description = "Live demo rig for the talk 'Your API is someone's pipeline'"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rich>=13.7",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]
