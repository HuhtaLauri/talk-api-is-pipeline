# Applied only to the talk session's server (sourced by talk.sh).
set -g mouse on
set -g base-index 0
set -g status-position top
set -g status-style "bg=default,fg=colour244"
set -g window-status-current-style "fg=colour214,bold"
set -g status-left "#[bold] api-is-pipeline  "
set -g status-left-length 30
set -g status-right "#[fg=colour244]%H:%M "
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_current_command} "
# F1..F4 jump straight to a window, no prefix (fast while talking)
bind -n F1 select-window -t :slides
bind -n F2 select-window -t :stage
bind -n F3 select-window -t :pipes
bind -n F4 select-window -t :lake
# F5: zoom the current pane (big text for the back row)
bind -n F5 resize-pane -Z
